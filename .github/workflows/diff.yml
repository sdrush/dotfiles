name: Nix Flake Diff
on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  nvd-diff-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build base system (main)
        run: nix build github:${{ github.repository }}/${{ github.base_ref }}#darwinConfigurations.typhon.system --out-link result-main || true

      - name: Build PR system (current)
        run: nix build .#darwinConfigurations.typhon.system --out-link result-pr || true

      - name: Diff closures with nvd
        run: |
          nix run nixpkgs#nvd -- diff result-main result-pr > nvd-diff.txt || true
          {
            echo "### 🍏 macOS Closure Diff (Typhon)"
            echo "\`\`\`"
            cat nvd-diff.txt
            echo "\`\`\`"
          } > pr-comment.txt

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pr-comment.txt
          comment_tag: nvd-diff-macos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nvd-diff-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "NixOS"
            flake_attr: "nixosConfigurations.nixos.config.system.build.toplevel"
            comment_tag: "nvd-diff-nixos"
          - name: "Generic Linux (system-manager)"
            flake_attr: "systemConfigs.default"
            comment_tag: "nvd-diff-generic-linux"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = root
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build base system (main)
        run: nix build github:${{ github.repository }}/${{ github.base_ref }}#${{ matrix.flake_attr }} --out-link result-main || true

      - name: Build PR system (current)
        run: nix build .#${{ matrix.flake_attr }} --out-link result-pr || true

      - name: Diff closures with nvd
        run: |
          nix run nixpkgs#nvd -- diff result-main result-pr > nvd-diff.txt || true
          {
            echo "### 🐧 Linux Closure Diff (${{ matrix.name }})"
            echo "\`\`\`"
            cat nvd-diff.txt
            echo "\`\`\`"
          } > pr-comment.txt

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pr-comment.txt
          comment_tag: ${{ matrix.comment_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
