name: Nix Flake Diff
on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  nvd-diff:
    strategy:
      matrix:
        include:
          - name: "macOS (Typhon)"
            os: macos-latest
            flake_attr: "darwinConfigurations.typhon.system"
            comment_tag: "nvd-diff-macos"
            symbol: "🍏"
          - name: "NixOS"
            os: ubuntu-latest
            flake_attr: "nixosConfigurations.nixos.config.system.build.toplevel"
            comment_tag: "nvd-diff-nixos"
            symbol: "🐧"
          - name: "Generic Linux (system-manager)"
            os: ubuntu-latest
            flake_attr: "systemConfigs.default"
            comment_tag: "nvd-diff-generic-linux"
            symbol: "🐧"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = root
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: sdrush
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build base system (main)
        run: nix build github:${{ github.repository }}/${{ github.base_ref }}#${{ matrix.flake_attr }} --out-link result-main || true

      - name: Build PR system (current)
        run: nix build .#${{ matrix.flake_attr }} --out-link result-pr || true

      - name: Diff closures with nvd
        run: |
          if [ -L result-main ] && [ -L result-pr ]; then
            nix run nixpkgs#nvd -- diff result-main result-pr > nvd-diff.txt || true
            {
              echo "### ${{ matrix.symbol }} ${{ matrix.name }} Closure Diff"
              echo "\`\`\`"
              cat nvd-diff.txt
              echo "\`\`\`"
            } > pr-comment.txt
          elif [ -L result-pr ]; then
            {
              echo "### ${{ matrix.symbol }} ${{ matrix.name }} Closure Diff"
              echo "⚠️ Could not compare to base branch (${{ github.base_ref }}). The base system may be failing to build."
              echo "The PR system built successfully."
            } > pr-comment.txt
          else
             {
              echo "### ${{ matrix.symbol }} ${{ matrix.name }} Closure Diff"
              echo "❌ PR system failed to build. See logs for details."
            } > pr-comment.txt
          fi

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pr-comment.txt
          comment_tag: ${{ matrix.comment_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
