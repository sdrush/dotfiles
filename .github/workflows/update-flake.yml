name: update-flake-lock
on:
  workflow_dispatch: # allows manual trigger
  schedule:
    - cron: "0 0 * * 0" # runs every Sunday at midnight

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@39617300c02824cf40c9ed88c03632f05781a74d # main
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@2b8214b74052309855365538356c9a7522d057d2 # main
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated
